<!DOCTYPE html>
<html>
<head>
<title>Smart Attendance System</title>
<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f4f4f4;
}

.container {
  margin-top: 40px;
}

button {
  padding: 10px 20px;
  margin: 10px;
  font-size: 16px;
  border: none;
  cursor: pointer;
  border-radius: 5px;
}

.add-btn { background: blue; color: white; }
.mark-btn { background: green; color: white; }
.view-btn { background: orange; color: white; }
.cam-btn  { background: purple; color: white; }

input, select {
  padding: 8px;
  margin: 5px;
}

table {
  margin: 20px auto;
  border-collapse: collapse;
  width: 60%;
}

th, td {
  border: 1px solid black;
  padding: 8px;
}

video {
  border: 2px solid black;
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>Smart Face Attendance System</h1>

<div class="container">

<!-- ================== REGISTRATION ================== -->
<h3>Register Employee (Upload Face Image)</h3>
<input id="empName" placeholder="Enter employee name">
<input type="file" id="empPhoto">
<button onclick="registerEmployee()">Register with Photo</button>

<hr>

<!-- ================== AUTO ATTENDANCE ================== -->
<h3>Automatic Face Attendance</h3>
<button class="mark-btn" onclick="startAutoAttendance()">
Start Face Attendance
</button>

<hr>

<!-- ================== VIEW ATTENDANCE ================== -->
<h3>View Attendance</h3>
<button class="view-btn" onclick="viewAttendance()">View Attendance</button>

<table id="attendanceTable">
  <tr>
    <th>ID</th>
    <th>Employee ID</th>
    <th>Status</th>
  </tr>
</table>

<p id="result"></p>

</div>

<script>

// -------------------- CAMERA --------------------
let stream;

function startCamera() {
  navigator.mediaDevices.getUserMedia({ video: true })
    .then(s => {
      stream = s;
      document.getElementById("video").srcObject = s;
    });
}

// Capture face during registration
function captureFace() {
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0);

  const imageData = canvas.toDataURL("image/jpeg");

  fetch("http://localhost:8000/save-face/", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      name: localStorage.getItem("currentEmployee"),
      image: imageData
    })
  })
  .then(r => r.json())
  .then(d => alert(d.message));
}

// -------------------- REGISTER EMPLOYEE --------------------
function registerEmployee() {
  const name = document.getElementById("empName").value;
  const fileInput = document.getElementById("empPhoto");

  if (!name || fileInput.files.length === 0) {
    alert("Enter name and select a photo!");
    return;
  }

  let formData = new FormData();
  formData.append("name", name);
  formData.append("file", fileInput.files[0]);

  fetch("http://localhost:8000/register-employee/", {
    method: "POST",
    body: formData
  })
  .then(r => r.json())
  .then(d => {
    document.getElementById("result").innerText = d.message;
  });
}


// -------------------- AUTO ATTENDANCE --------------------
function startAutoAttendance() {
  fetch("http://localhost:8000/start-face-attendance/")
  .then(r => r.json())
  .then(d => {
    document.getElementById("result").innerText = d.message;
  });
}

// -------------------- VIEW ATTENDANCE --------------------
function viewAttendance() {
  fetch("http://localhost:8000/attendance/")
  .then(r => r.json())
  .then(data => {

    const table = document.getElementById("attendanceTable");

    table.innerHTML = `
      <tr>
        <th>ID</th>
        <th>Employee ID</th>
        <th>Status</th>
      </tr>
    `;

    data.forEach(row => {
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${row.id}</td>
        <td>${row.employee_id}</td>
        <td>${row.status}</td>
      `;

      table.appendChild(tr);
    });
  });
}

</script>
</body>
</html>
